services:
  web-nginx:
    image: nginx:1.29
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ../../services/web-service/public:/var/www/html/public:ro
      - ../docker/nginx/web-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-service:
        condition: service_healthy
    networks:
      - backend
