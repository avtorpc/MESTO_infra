services:
  node-service:
    image: mesto-node-service:latest
    build:
      context: ../../services/node-service
      dockerfile: ../../ONMI_infra/docker/node/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB}
      NODE_DB_USER: node_app
      NODE_DB_PASSWORD: ${NODE_DB_PASSWORD:?Set NODE_DB_PASSWORD in local .env}
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:?Set CHAT_TOKEN_SECRET in local .env}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CATALOG_SERVICE_URL: http://nginx/catalog
    networks: [backend]
    depends_on: [postgres]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/chat/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  chat-db:
    image: postgres:17
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NODE_DB_PASSWORD: ${NODE_DB_PASSWORD:?Set NODE_DB_PASSWORD in local .env}
    volumes:
      - ../docker/postgres/chat-role.sql:/setup/chat-role.sql:ro
    entrypoint: [psql, -v, ON_ERROR_STOP=1, -f, /setup/chat-role.sql]
    networks: [backend]
  chat-test:
    image: node:22-bookworm-slim
    profiles: [tools]
    working_dir: /app
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      NODE_DB_USER: node_app
      NODE_DB_PASSWORD: ${NODE_DB_PASSWORD}
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET}
    volumes:
      - ../../services/node-service:/app
    command: [sh, -c, "npm ci --ignore-scripts && npm run build && npm run test:contract"]
    networks: [backend]
