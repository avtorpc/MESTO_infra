services:
  web-service:
    build:
      context: ../docker/php
    working_dir: /var/www/html
    environment:
      NODE_SERVICE_URL: http://node-service:3000/chat
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:?Set CHAT_TOKEN_SECRET in local .env}
      CATALOG_SERVICE_URL: http://nginx/catalog
      AUTH_SERVICE_URL: http://nginx/auth
      VERIFICATION_SERVICE_URL: http://nginx/api/registration
      WEB_SERVICE_INTERNAL_TOKEN: ${WEB_SERVICE_INTERNAL_TOKEN:-}
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-local-web-service-change-before-deploy}
    volumes:
      - ../../services/web-service:/var/www/html
    # web-service ships its complete vendor directory; startup must not contact Packagist.
    command: ["sh", "-c", "set -e; test -f .env || cp .env.example .env; php-app bin/check-vendor.php; exec php-fpm"]
    healthcheck:
      test: ["CMD", "php-app", "bin/console", "about", "--no-interaction"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - backend
