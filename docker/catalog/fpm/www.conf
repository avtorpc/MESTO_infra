; =========================
; ПУЛ ПО УМОЛЧАНИЮ (явно указываем стандартные настройки)
; =========================
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

; НЕТ php_admin_value - использует php.ini

; =========================
; НЕ ОЧИЩАТЬ ОКРУЖЕНИЕ
; =========================
clear_env = no

; =========================
; ПУЛ ДЛЯ ИМПОРТА (специальные настройки)
; =========================
[import]
user = www-data
group = www-data
listen = 9001  ; ← ДРУГОЙ ПОРТ!

; =========================
; НЕ ОЧИЩАТЬ ОКРУЖЕНИЕ
; =========================
clear_env = no

pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; ТОЛЬКО ДЛЯ ИМПОРТА - увеличенные параметры
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 200M
php_admin_value[max_execution_time] = 600
php_admin_value[max_input_time] = 600
php_admin_value[memory_limit] = 512M
