server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_service_upstream auth-service:9000;
    set $catalog_service_upstream catalog-service:9001;
    set $dictionaries_service_upstream dictionaries-service:9000;
    set $email_service_upstream email-service:9000;
    set $verification_service_upstream verification-service:9000;
    set $web_service_upstream web-service:9000;

    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 10M;

    location /chat/ {
        set $chat_upstream http://node-service:3000;
        proxy_pass $chat_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    # Preserve the event API prefix; resolve container addresses again after restarts.
    location /event/ {
        set $event_api_upstream http://event-api-service:8080;
        proxy_pass $event_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Microservices receive their route without the gateway prefix.
    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;
        include fastcgi_params;
        fastcgi_pass $auth_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    location /api/registration/ {
        rewrite ^/api/registration/(.*)$ /$1 break;
        include fastcgi_params;
        fastcgi_pass $verification_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    location /email/ {
        rewrite ^/email/(.*)$ /$1 break;
        include fastcgi_params;
        fastcgi_pass $email_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    location /api/refbook/ {
        rewrite ^/api/refbook/(.*)$ /$1 break;
        include fastcgi_params;
        fastcgi_pass $dictionaries_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    location /catalog/ {
        rewrite ^/catalog/(.*)$ /$1 break;
        include fastcgi_params;
        fastcgi_pass $catalog_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    # Catalog file import keeps its original upload limits and timeouts.
    location = /catalog/import/file {
        client_max_body_size 200M;
        client_body_timeout 600s;
        client_body_buffer_size 1M;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_connect_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
        send_timeout 600s;
        include fastcgi_params;
        fastcgi_pass $catalog_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /import/file$is_args$args;
    }

    # Assets are served here; browser pages and forms are handled by web-service.
    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $web_service_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
}
