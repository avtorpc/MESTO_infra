server {

    listen 80 default_server;
    server_name _;

    # глобальные лимиты (для всех сервисов)
    client_max_body_size 10M;


    # === KAFKA SERVICE ===
    location /event/kafka/ {

        proxy_pass http://event-api-service:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }

#/api/dictionaries/users/123
#        ↓
#rewrite last
#        ↓
#/api/dictionaries/index.php?/users/123
#        ↓
#location selection AGAIN
#        ↓
#/api/dictionaries/
#        ↓
#try_files
#        ↓
#/api/dictionaries/index.php
#        ↓
#PHP-FPM


    # === DICTIONARIES SERVICE ===
    location /api/refbook/ {
        alias /var/www/html/public/;
        try_files $uri @refbook_fallback;

        location ~ \.php$ {
            fastcgi_pass dictionaries-service:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME /api/refbook/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param HTTP_X_REWRITE_URL $request_uri;
        }
    }

    location @refbook_fallback {
        rewrite ^/api/refbook/(.*)$ /api/refbook/index.php?/$1 last;
    }


# =========================
# CATALOG - основной блок
# =========================
location /catalog/ {

    # 1. Отрезаем префикс /catalog
    rewrite ^/catalog(?:/(.*))?$ /$1?$args break;

    include fastcgi_params;
    fastcgi_pass catalog-service:9000;

    # 2. Правильный SCRIPT_FILENAME
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;

    # 3. Передаем в Symfony уже очищенный URI (без /catalog)
    fastcgi_param REQUEST_URI $uri?$args;

    # 4. SCRIPT_NAME - корневой index.php
    fastcgi_param SCRIPT_NAME /index.php;

    # 5. PATH_INFO - передаем то, что после index.php
    fastcgi_param PATH_INFO $fastcgi_path_info;

    fastcgi_split_path_info ^(.+\.php)(/.*)$;
}

# =========================
# IMPORT - загрузка файлов (200МБ)
# =========================
location = /catalog/import/file {

    # Лимиты на загрузку
    client_max_body_size 200M;
    client_body_timeout 600s;
    client_body_buffer_size 1M;

    # Отключаем буферизацию для потоковой загрузки
    fastcgi_buffering off;
    fastcgi_request_buffering off;

    # Таймауты FastCGI
    fastcgi_connect_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;

    # Дополнительные таймауты NGINX
    send_timeout 600s;
    proxy_read_timeout 600s;

    include fastcgi_params;
    fastcgi_pass catalog-service:9001;

    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param REQUEST_URI /import/file$is_args$args;
    fastcgi_param SCRIPT_NAME /index.php;
}



    # === AUTH SERVICE ===
    location /auth/ {
        alias /var/www/html/public/;
        try_files $uri @auth_fallback;

        location ~ \.php$ {
            fastcgi_pass auth-service:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME /auth/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param HTTP_X_REWRITE_URL $request_uri;
        }
    }

    location @auth_fallback {
        rewrite ^/auth/(.*)$ /auth/index.php last;
    }

    # === VERIFICATION SERVICE (API) ===
    location /api/registration/ {
        alias /var/www/html/public/;
        try_files $uri @verify_fallback;

        location ~ \.php$ {
            fastcgi_pass verification-service:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME /api/registration/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param HTTP_X_REWRITE_URL $request_uri;
        }
    }

    location @verify_fallback {
        rewrite ^/api/registration/(.*)$ /api/registration/index.php?/$1 last;
    }

    # === EMAIL SERVICE ===
    location /email/ {
        alias /var/www/html/public/;
        try_files $uri @email_fallback;

        location ~ \.php$ {
            fastcgi_pass email-service:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME /email/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param HTTP_X_REWRITE_URL $request_uri;
        }
    }

    location @email_fallback {
        rewrite ^/email/(.*)$ /email/index.php?/$1 last;
    }

    root /var/www/html/public;
    location / {
        try_files $uri @web_front;
    }
    location @web_front {
        include fastcgi_params;
        fastcgi_pass web-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
}
