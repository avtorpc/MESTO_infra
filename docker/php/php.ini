; =============================
; Общие настройки PHP для dev
; =============================

[PHP]
; Ограничение памяти
memory_limit = 512M

; Максимальное время выполнения скрипта
max_execution_time = 300
max_input_time = 300

; Максимальный размер POST и загружаемых файлов
post_max_size = 50M
upload_max_filesize = 50M

; Отображение ошибок для dev
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Логирование ошибок
error_log = /var/log/php/error.log

; Таймзона
; date.timezone = Europe/Moscow
date.timezone=UTC

; =============================
; Сессии
; =============================
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.gc_maxlifetime = 1440

; =============================
; Symfony Dev рекомендации
; =============================
; Поведение ошибок и вывод для отладки
html_errors = On
report_memleaks = On

; Включаем short_open_tag, иногда нужно для legacy
short_open_tag = On

; =============================
; Загрузка файлов
; =============================
upload_max_filesize = 200M
post_max_size = 200M
memory_limit = 1G
max_execution_time = 600
max_input_time = 600
