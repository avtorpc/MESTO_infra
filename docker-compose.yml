services:
  web-service:
    build:
      context: ./docker/php
    working_dir: /var/www/html
    environment:
      WEB_SERVICE_INTERNAL_TOKEN: ${WEB_SERVICE_INTERNAL_TOKEN:-}
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-local-web-service-change-before-deploy}
    volumes:
      - ../services/web-service:/var/www/html
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && exec php-fpm"]
    healthcheck:
      test: ["CMD", "php", "bin/console", "about", "--no-interaction"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - backend


  nginx:
    image: nginx:1.29
    container_name: gateway_nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ../services/web-service/public:/var/www/html/public:ro
      - ../services:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      web-service:
        condition: service_healthy
      auth-service:
        condition: service_started

      verification-service:
        condition: service_started

      email-service:
        condition: service_started


      event-worker-service:
        condition: service_started

      event-api-service:
        condition: service_healthy

    networks:
      - backend


  auth-service:
    build:
      context: ./docker/php
    container_name: auth_service_php
    environment:
      WEB_SERVICE_INTERNAL_TOKEN: ${WEB_SERVICE_INTERNAL_TOKEN:-}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}

      APP_SHARE_DIR: ${APP_SHARE_DIR}
      DEFAULT_URI: ${DEFAULT_URI}

      # DB core
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DB_SERVER_VERSION: ${DB_SERVER_VERSION}
      DB_CHARSET: ${DB_CHARSET}

      # service-specific schema
      DB_SCHEMA: ${AUTH_DB_SCHEMA}

      # external services
      REDIS_URL: ${REDIS_URL}

      # API kafka
      KAFKA_GATEWAY_URL: ${KAFKA_GATEWAY_URL}

      # TimeZone
      APP_TIMEZONE: ${TZ}

      # unified DSN
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?serverVersion=${DB_SERVER_VERSION}&charset=${DB_CHARSET}&options=-csearch_path%3D${AUTH_DB_SCHEMA}"

    volumes:
      - ../services/auth-service:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - postgres
      - redis

    networks:
      - backend


  verification-service:
    build:
      context: ./docker/php
    container_name: verification_service_php

    environment:
      # =====================
      # APP
      # =====================
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}

      APP_SHARE_DIR: ${APP_SHARE_DIR}
      DEFAULT_URI: ${DEFAULT_URI}

      # =====================
      # POSTGRES
      # =====================
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

      DB_SERVER_VERSION: ${DB_SERVER_VERSION}
      DB_CHARSET: ${DB_CHARSET}

      DB_SCHEMA: ${VERIFICATION_DB_SCHEMA}

      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?serverVersion=${DB_SERVER_VERSION}&charset=${DB_CHARSET}&options=-csearch_path%3D${VERIFICATION_DB_SCHEMA}"

      # REDIS
      REDIS_URL: ${REDIS_URL}

      # API kafka
      KAFKA_GATEWAY_URL: ${KAFKA_GATEWAY_URL}

      APP_TIMEZONE: ${TZ}

      DICTIONARY_SERVICE_URL: ${DICTIONARY_SERVICE_URL}

    volumes:
      - ../services/verification-service:/var/www/html

    working_dir: /var/www/html

    depends_on:
      - postgres
      - redis

    networks:
      - backend


  dictionaries-service:
    build:
      context: ./docker/php
    container_name: dictionaries_service_php

    environment:
      # =====================
      # APP
      # =====================
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}

      APP_SHARE_DIR: ${APP_SHARE_DIR}
      DEFAULT_URI: ${DEFAULT_URI}

      # =====================
      # POSTGRES
      # =====================
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

      DB_SERVER_VERSION: ${DB_SERVER_VERSION}
      DB_CHARSET: ${DB_CHARSET}

      DB_SCHEMA: ${DICTIONARIES_DB_SCHEMA}

      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?serverVersion=${DB_SERVER_VERSION}&charset=${DB_CHARSET}&options=-csearch_path%3D${DICTIONARIES_DB_SCHEMA}"

      # =====================
      # REDIS
      # =====================
      REDIS_URL: ${REDIS_URL}
      DICTIONARY_CACHE_TTL: ${DICTIONARY_CACHE_TTL}
      DICTIONARY_CACHE_VERSION: ${DICTIONARY_CACHE_VERSION}

      KAFKA_GATEWAY_URL: ${KAFKA_GATEWAY_URL}

      APP_TIMEZONE: ${TZ}

    volumes:
      - ../services/dictionaries-service:/var/www/html

    working_dir: /var/www/html

    depends_on:
      - postgres
      - redis

    networks:
      - backend


  email-service:
    build:
      context: ./docker/php
    container_name: email_service_php
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}

      APP_SHARE_DIR: ${APP_SHARE_DIR}
      DEFAULT_URI: ${DEFAULT_URI}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DB_SERVER_VERSION: ${DB_SERVER_VERSION}
      DB_CHARSET: ${DB_CHARSET}

      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?serverVersion=${DB_SERVER_VERSION}&charset=${DB_CHARSET}&options=-csearch_path%3D${EMAIL_DB_SCHEMA}"

      DB_SCHEMA: ${EMAIL_DB_SCHEMA}

      REDIS_URL: ${REDIS_URL}

      KAFKA_GATEWAY_URL: ${KAFKA_GATEWAY_URL}

      APP_TIMEZONE: ${TZ}

      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAILER_DSN: ${MAILER_DSN}

      APP_NAME: ${EMAIL_APP_NAME}
      APP_VERSION: ${EMAIL_APP_VERSION}

    volumes:
      - ../services/email-service:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - redis
      - postgres

    networks:
      - backend


  postgres:
    image: postgres:17
    container_name: postgres_main
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=${DB_CHARSET} --locale=${DB_COLLATION}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./storage/postgresql:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - backend


  redis:
    image: redis:7.2
    container_name: redis_main
    ports:
      - "6379:6379"
    networks:
      - backend


  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka_main
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}

      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}

      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}

    networks:
      - backend


  event-api-service:
    build:
      context: ../java_services/event-api-service

    container_name: event_api_service

    environment:
      SERVER_PORT_JAVA: ${SERVER_PORT_JAVA}

      SPRING_PROFILES_ACTIVE: docker

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      KAFKA_TOPIC_VERIFICATION_EVENT: ${KAFKA_TOPIC_VERIFICATION_EVENT}

      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}

    volumes:
      - ../java_services/event-api-service/config/routing.yml:/etc/app/routing.yml

    depends_on:
      - kafka

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

    networks:
      - backend


  event-worker-service:
    build:
      context: ../java_services/event-worker-service

    container_name: event_worker_service

    environment:

      SERVER_PORT_JAVA: ${SERVER_PORT_JAVA}

      SPRING_PROFILES_ACTIVE: docker

      ROUTING_FILE: /etc/app/routing.yml

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}

      KAFKA_TOPIC_VERIFICATION_EVENT: ${KAFKA_TOPIC_VERIFICATION_EVENT}
      KAFKA_TOPIC_AUTH_EVENT: ${KAFKA_TOPIC_AUTH_EVENT}
      KAFKA_TOPIC_BITRIX_EVENT: ${KAFKA_TOPIC_BITRIX_EVENT}

      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}

      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      BITRIX_SERVICE_URL: ${BITRIX_SERVICE_URL}

    volumes:
      - ../java_services/event-worker-service/config/routing.yml:/etc/app/routing.yml

    depends_on:
      - kafka

    networks:
      - backend

networks:
  backend:
